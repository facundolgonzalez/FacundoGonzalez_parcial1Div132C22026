<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial 1</title>

    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Parcial 1</h1>
        <h2>Div. 132</h2>
    </header>

    <main>
        <div id="barra-horizontal">
            <h2 id="usuarios">Users</h2>
            <hr>
            
            <div id="filtros">
                <label>
                <input type="radio" name="estado" checked>
                Active
                </label>

                <label>
                    <input type="radio" name="estado">
                    Inactive
                </label>

                <label>
                    <input type="radio" name="estado">
                    All
                </label>

                <input type="text" id="search" placeholder="Search Users">
            </div>
        </div>
        <div id="acciones">
            <button class="botones" type="button">CREATE</button>
            <button class="botones" type="button">DEACTIVATE</button>
            <button class="botones" type="button">RESET PASSWORD</button>
        </div>
        <div id="users-container"></div>
    </main>

    <footer>
        <p>Facundo Gonzalez</p>
    </footer>
</body>
</html>
